name: Validation

on:
  push:
    branches:
      - main
      - next
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Oxlint, Stylelint etc.)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup
        with:
          npm_auth_token: ${{ secrets.READER_TOKEN }}

      - name: Lint
        run: yarn lint

  validate-examples:
    name: Validate component examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup
        with:
          npm_auth_token: ${{ secrets.READER_TOKEN }}

      - name: Validate example code
        run: yarn validate:eksempler

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup
        with:
          npm_auth_token: ${{ secrets.READER_TOKEN }}

      - name: Test
        run: yarn test

  ui:
    name: UI tests (Storybook, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      # --ipc=host prevents Chromium OOM/connection-closed crashes caused by Docker's default 64MB /dev/shm;
      # --init reaps zombie browser processes cleanly (recommended by Playwright and Vitest in Docker).
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup project
        uses: ./.github/actions/setup
        with:
          npm_auth_token: ${{ secrets.READER_TOKEN }}

      - name: Test UI
        run: yarn storybook:test --max-workers=2 --browser.name=${{ matrix.browser }}
        env:
          HOME: /root
          # Workaround for Chromium Linux shared-memory leak across torn-down Vitest iframes
          # (https://issues.chromium.org/issues/530892387): Vitest's built-in CDP garbage collection
          # only triggers when /tmp free disk drops below 4 GiB, so raise the threshold on CI runners
          # (ignored by Vitest for Firefox and WebKit).
          VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: "1000"
