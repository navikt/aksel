version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@navikt"
    token: ${{ secrets.READER_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    registries:
      - npm-github
    groups:
      sanity:
        applies-to: version-updates
        patterns:
          - "sanity"
          - "sanity-*"
          - "@sanity/*"
          - "next-sanity"
          - "@portabletext/*"
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "@eslint/*"
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
      storybook:
        applies-to: version-updates
        patterns:
          - "*storybook*"
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
      # Security updates ignore version-update groups, so mirror them to keep lockstep packages together.
      sanity-security:
        applies-to: security-updates
        patterns:
          - "sanity"
          - "sanity-*"
          - "@sanity/*"
          - "next-sanity"
          - "@portabletext/*"
      eslint-security:
        applies-to: security-updates
        patterns:
          - "eslint"
          - "@eslint/*"
      react-security:
        applies-to: security-updates
        patterns:
          - "react"
          - "react-dom"
      storybook-security:
        applies-to: security-updates
        patterns:
          - "*storybook*"
      vitest-security:
        applies-to: security-updates
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    registries:
      - npm-github
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - "/aksel.nav.no"
      - "/apps/*"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
